[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zyra-network"
version = "2.1.25"
description = "A powerful, self-organizing decentralized AI network client."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "psutil>=5.9.0",
    "numpy>=1.24.0",
    "httpx",
    "openai",
    "pyautogui",
    "duckduckgo-search",
    "web3>=6.0.0",
    "python-dotenv",
    "prompt_toolkit>=3.0.0",
    "requests",
    "websockets"
]

[project.optional-dependencies]
desktop = [
    "PySide6>=6.5.0",
    "torch>=2.0.0"
]
dev = [
    "pytest",
    "pyinstaller"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "ai*", "zyra_cmd*", "p2p*"]
[project.scripts]
zyra = "zyra_cmd.zyra_cli:main"
