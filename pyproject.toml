[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my-ai"
version = "0.0.1"
description = "A locally built and trained Artificial Intelligence application."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "PyYAML>=6.0",
    "torch>=2.0.0",
    "psutil>=5.9.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pyinstaller"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.setuptools]
packages = ["app", "ai", "cli"]

[project.scripts]
zyra = "cli.zyra_cli:main"
